name: NEX regression tests

on:
  push:
    branches:
      - feat/nex-project-generation-preview
      - feat/chrome-extension-sala-do-futuro
      - feat/nex-school-task-detection
  pull_request:
    branches:
      - feature/natural-dialogue-core
      - feat/nex-project-generation-preview

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check runtime
        run: node --version && npm --version
      - name: Run regression suite
        run: npm test
      - name: Check Chrome extension JavaScript
        run: node --check extension/sala-do-futuro/popup.js && node --check extension/sala-do-futuro/policy.js
      - name: Validate Chrome extension manifest
        run: node -e "const m=require('./extension/sala-do-futuro/manifest.json'); if(m.manifest_version!==3) process.exit(1); console.log(m.name)"
