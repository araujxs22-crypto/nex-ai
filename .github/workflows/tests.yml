name: NEX regression tests

on:
  push:
    branches:
      - feat/nex-project-generation-preview
      - feat/playwright-sala-do-futuro
  pull_request:
    branches:
      - feature/natural-dialogue-core
      - feat/nex-project-generation-preview

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check runtime
        run: node --version && npm --version
      - name: Run regression suite
        run: npm test
      - name: Check local browser agent syntax
        run: npm run check --prefix browser-agent
