name: NEX Core tests

on:
  pull_request:
    branches: [main, 'fix/**', 'feature/**', 'integration/**', 'feat/nex-school-task-detection']
  push:
    branches:
      - main
      - 'fix/**'
      - 'eval/**'
      - 'calibration/**'
      - 'feature/**'
      - 'integration/**'\n      - 'feat/nex-browser-agent'

permissions:
  contents: read

jobs:
  test:
    name: Run Node.js test suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests
        run: npm test
