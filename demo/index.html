<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>NEX Core Demo</title><style>body{font:16px system-ui;max-width:900px;margin:40px auto;padding:0 16px}button{padding:8px 12px;margin:4px}textarea{width:100%;height:90px}pre{background:#111;color:#eee;padding:16px;overflow:auto}</style></head><body><h1>NEX Core — demonstração offline</h1><p>Esta página não recria a interface do NEX; apenas demonstra o módulo.</p><button id="train">Treinar rede</button><button id="ask">Executar comando</button><textarea id="input">crie uma cena 3d noturna com uma nave e camera pan</textarea><pre id="out">Aguardando...</pre><script type="module">import {NexCore} from '../src/index.js'; const core=new NexCore(); const out=document.querySelector('#out'); document.querySelector('#train').onclick=()=>{const h=core.train({epochs:180});out.textContent=JSON.stringify({inicio:h[0],fim:h.at(-1),status:core.status},null,2)}; document.querySelector('#ask').onclick=()=>out.textContent=JSON.stringify(core.ask(document.querySelector('#input').value),null,2);</script></body></html>
