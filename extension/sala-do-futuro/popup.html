<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEX — Agente de Navegador</title>
<style>
:root{color-scheme:dark;font:13px/1.45 "Segoe UI",Arial,sans-serif;background:#151823;color:#edf0fa}
*{box-sizing:border-box}body{width:360px;margin:0;padding:15px}
h1{font-size:17px;margin:0 0 4px}.sub,.hint{color:#aeb7cc;font-size:11px}
label{display:block;margin:10px 0 4px;color:#cbd4e8;font-weight:600}
input,textarea{width:100%;background:#0e111a;color:#edf0fa;border:1px solid #3a4257;border-radius:7px;padding:9px;font:12px "Segoe UI",Arial,sans-serif}
textarea{height:145px;resize:vertical;font-family:Consolas,monospace}
button{border:0;border-radius:8px;padding:9px 10px;font-weight:600;cursor:pointer;background:#30384a;color:#edf0fa}
button.primary{background:#887cf2;color:#111522}button:disabled{opacity:.4;cursor:not-allowed}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
#status{min-height:34px;padding:8px;border:1px solid #3a4257;border-radius:8px;color:#b8c5df;font-size:11px;margin:10px 0}
small{color:#8290aa}.warning{color:#e6c98a}
</style></head>
<body>
<h1>NEX — Agente de Navegador</h1>
<p class="sub">A extensão atua somente na aba atual e apenas quando você aciona um comando.</p>
<label for="googleQuery">Pesquisar no Google</label>
<input id="googleQuery" type="search" placeholder="Digite o que deseja pesquisar">
<button id="googleSearch" class="primary" style="width:100%;margin-top:7px">Pesquisar no Google</button>
<label for="url">Abrir endereço HTTPS</label>
<input id="url" type="url" placeholder="https://www.google.com">
<div class="actions"><button id="navigate" class="primary">Abrir endereço</button><button id="read">Ler página</button></div>
<label for="target">Texto do botão ou link para clicar</label>
<input id="target" placeholder="Ex.: Pesquisar">
<button id="click" class="primary" style="width:100%;margin-top:7px">Clicar no elemento encontrado</button>
<label for="field">Campo a preencher (nome, rótulo ou placeholder)</label>
<input id="field" placeholder="Ex.: Pesquisar">
<label for="value">Texto para digitar</label>
<input id="value" placeholder="Digite o texto">
<button id="type" style="width:100%;margin-top:7px">Preencher campo (não envia)</button>
<div id="status" role="status" aria-live="polite">Aguardando sua ação.</div>
<label for="preview">Conteúdo lido da página</label>
<textarea id="preview" readonly placeholder="O texto da página aparecerá aqui."></textarea>
<div class="actions"><button id="copy" disabled>Copiar texto</button><button id="clear">Limpar</button></div>
<p class="hint warning">Não lê cookies ou senhas. Não envia formulários, mensagens ou compras. Confira a página antes de cada ação.</p>
<script type="module" src="popup.js"></script>
</body></html>
