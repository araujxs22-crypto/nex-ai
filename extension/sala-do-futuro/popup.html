<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NEX — Sala do Futuro</title>
  <style>
    :root{color-scheme:dark;font:14px/1.45 "Segoe UI",Arial,sans-serif;background:#151823;color:#edf0fa}
    *{box-sizing:border-box}body{width:340px;margin:0;padding:16px}
    h1{font-size:17px;margin:0 0 5px}p{color:#aeb7cc;font-size:12px;margin:0 0 14px}
    button{width:100%;border:0;border-radius:9px;padding:11px 12px;margin:5px 0;font:600 13px "Segoe UI",Arial,sans-serif;cursor:pointer}
    #read{background:#887cf2;color:#111522}#copy{background:#30384a;color:#edf0fa}
    button:disabled{opacity:.45;cursor:not-allowed}
    #status{min-height:34px;padding:8px 10px;border:1px solid #3a4257;border-radius:8px;color:#b8c5df;font-size:11px;margin:10px 0}
    #preview{width:100%;height:190px;resize:vertical;background:#0e111a;color:#e4e9f6;border:1px solid #3a4257;border-radius:8px;padding:9px;font:11px/1.5 Consolas,monospace}
    .fine{font-size:10px;color:#7f8ba5;margin-top:10px}
  </style>
</head>
<body>
  <h1>NEX — Leitor da Sala do Futuro</h1>
  <p>Abra uma atividade na Sala do Futuro. A extensão só lê a página quando você clicar abaixo.</p>
  <button id="read">Ler página atual</button>
  <div id="status" role="status" aria-live="polite">Aguardando sua ação.</div>
  <textarea id="preview" readonly placeholder="O texto visível da atividade aparecerá aqui."></textarea>
  <button id="copy" disabled>Copiar texto para o NEX</button>
  <p class="fine">Não lê senhas, não clica em respostas e não envia atividades. O texto só é copiado quando você pedir.</p>
  <script type="module" src="popup.js"></script>
</body>
</html>
